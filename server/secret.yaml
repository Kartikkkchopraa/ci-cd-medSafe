apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  PORT: "${PORT}"
  FRONTEND_URL: "${FRONTEND_URL}"
  DATABASE_URL: "${DATABASE_URL}"
  DATABASE_URL_AWS: "${DATABASE_URL_AWS}"
  JWT_SECRET: "${JWT_SECRET}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  OPENAI_MODEL: "${OPENAI_MODEL}"
  
